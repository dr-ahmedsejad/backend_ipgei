name: Tests pytest (sprint 2)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: siga.settings.test
        run: |
          pytest tests/ \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

      - name: Coverage threshold check (services critiques)
        run: |
          pytest tests/test_calcul_notes.py \
                 tests/test_calculer_element.py \
                 tests/test_deliberation_semestre.py \
                 tests/test_deliberation_annuelle.py \
                 tests/test_vacation_models.py \
                 tests/test_rbac.py \
            --cov=apps.evaluations.services \
            --cov=apps.vacation.models \
            --cov=core.permissions \
            --cov-fail-under=60
