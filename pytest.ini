[pytest]
DJANGO_SETTINGS_MODULE = siga.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    --no-migrations
markers =
    slow: tests lents (DB lourde, calculs PV complets)
    integration: tests qui touchent l'API DRF (Client)
    regression: regression sur cas reels (snapshot data)
    unit: test unitaire pur (sans DB ni HTTP)
