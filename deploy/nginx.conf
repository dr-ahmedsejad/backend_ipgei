# ═══════════════════════════════════════════════════════════════
# Nginx — Reverse proxy SIGA (HTTPS)
# Port 80  → redirection 301 vers HTTPS.
# Port 443 → terminaison TLS (Let's Encrypt) + sert statics/media,
#            proxy /api et /admin vers Django, le reste vers Next.js.
#
# Le placeholder `http://__SIGA_API_HOST__` (injecte au build frontend) est
# reecrit a la volee en `$scheme://$http_host` (= https://ent.iss-gp.mr) → les
# XHR du frontend tombent sur le MEME origin que la page (cookies JWT httpOnly,
# SameSite=Lax).
# ═══════════════════════════════════════════════════════════════

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

# Durcissement : ne pas exposer la version de Nginx (header Server + pages d'erreur).
server_tokens off;

# PAS de rate limiting par IP ici : le campus (jusqu'a ~300 etudiants derriere UNE
# SEULE IP publique via NAT) serait vu comme un seul client et bloque en masse.
# La protection anti-abus se fait PAR UTILISATEUR cote Django (django-axes sur le
# login + throttle DRF sur /verifier) → insensible au NAT. Pour ajouter une couche
# Nginx anti-flood sans risque, whitelister l'IP fixe du campus (motif geo/map).

# ─── HTTP → redirection HTTPS ───────────────────────────────────
server {
    listen 80;
    server_name _;
    # Tout le trafic HTTP est redirige en HTTPS (301 permanent).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS (app) ────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ent.iss-gp.mr;

    # ─── Certificat Let's Encrypt (monte depuis l'hote via compose) ─
    ssl_certificate     /etc/letsencrypt/live/ent.iss-gp.mr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ent.iss-gp.mr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Limite upload (utile pour justificatifs PDF, photos profs, etc.)
    client_max_body_size 50M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ─── Headers de securite ────────────────────────────────────
    # CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy et
    # Permissions-Policy sont deja poses PAR L'APPLICATION : le frontend Next.js
    # (next.config.ts — CSP de prod SANS 'unsafe-eval', X-Frame-Options DENY,
    # Permissions-Policy) et le backend Django (settings). On ne les DUPLIQUE PAS
    # ici, sinon en-tetes en double + conflit (ex. SAMEORIGIN vs DENY).
    # Nginx ne pose que HSTS (couche TLS que l'application ne gere pas).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ─── API Django ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # PDF generation peut prendre du temps
    }

    # ─── Admin Django ───────────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Statics Django (collectstatic) ─────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Media (uploads utilisateurs) ───────────────────────────
    # Protégé par auth_request : Nginx interroge Django (/internal/media-auth/)
    # avant de servir le fichier. 204 = autorisé, 401/403 = refusé.

    # EXCEPTION : assets PUBLICS de l'institution (logo, sceau, favicon) — servis
    # SANS auth_request (affiches AVANT login). `^~` = priorite sur /media/ protege.
    location ^~ /media/institutions/logos/ {
        root /var/www;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location ^~ /media/institutions/sceaux/ {
        root /var/www;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location ^~ /media/institutions/favicons/ {
        root /var/www;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location /media/ {
        auth_request /internal/media-auth/;
        alias /var/www/media/;
        # Pas de cache public (contenu privé / PII).
        add_header Cache-Control "private, no-store" always;
        # Durcissement : forcer le téléchargement, jamais l'interprétation.
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Sous-requête interne d'authentification pour /media/ (jamais exposée).
    location = /internal/media-auth/ {
        internal;
        proxy_pass http://backend_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        proxy_set_header Host             $http_host;
        proxy_set_header X-Original-URI   $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie           $http_cookie;
    }

    # ─── Frontend Next.js (UI dashboard, login, etc.) ───────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITIQUE pour sub_filter : empecher Next.js de gzip-er.
        proxy_set_header Accept-Encoding   "";

        # Reecriture du placeholder NEXT_PUBLIC_API_URL injecte au build →
        # `$scheme://$http_host` = https://ent.iss-gp.mr. XHR sur le meme origin.
        sub_filter 'http://__SIGA_API_HOST__' '$scheme://$http_host';
        sub_filter_once off;
        sub_filter_types text/html text/css text/javascript application/javascript application/json;

        # Support Next.js HMR / streaming SSE
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ─── iss-gp.mr / www — site ISS (placeholder « en construction ») ─
# Servi en attendant la mise en ligne du vrai site. Meme certificat SAN
# (ent + iss + www, emis par certbot). Remplacer ce bloc par un proxy vers le
# conteneur du site ISS le jour du deploiement.
server {
    listen 443 ssl;
    http2 on;
    server_name iss-gp.mr www.iss-gp.mr;

    ssl_certificate     /etc/letsencrypt/live/ent.iss-gp.mr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ent.iss-gp.mr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    # Page STATIQUE servie directement par Nginx (pas d'app derriere) → c'est ici
    # que les en-tetes de securite doivent etre poses (une seule fois, pas de doublon).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # CSP stricte adaptee a la page statique (styles inline + favicon.png, aucun script).
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

    root  /var/www/iss;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
