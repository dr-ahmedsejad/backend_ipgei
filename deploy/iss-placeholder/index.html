<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Institut Supérieur de la Statistique</title>
  <meta name="description" content="Institut Supérieur de la Statistique — notre nouveau site arrive bientôt.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    :root{
      --iss:#006633; --iss-d:#004f27; --iss-l:#0a7a48;
      --ink:#16241d; --muted:#5f6f67; --line:#e5ece8;
      --bg1:#f2f7f4; --bg2:#e6f0ea;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1000px 500px at 50% -8%, #d9ebe1 0%, transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      display:flex; align-items:center; justify-content:center;
      padding:32px 20px; -webkit-font-smoothing:antialiased;
    }
    .card{
      width:100%; max-width:540px; background:#fff;
      border:1px solid var(--line); border-radius:22px;
      box-shadow:0 24px 60px -28px rgba(15,50,32,.35);
      padding:44px 36px 34px; text-align:center;
    }
    .logo{
      width:76px; height:76px; margin:0 auto 22px; border-radius:20px;
      background:linear-gradient(145deg, var(--iss-l), var(--iss-d));
      display:grid; place-items:center; color:#fff;
      font-weight:800; font-size:24px; letter-spacing:.02em;
      box-shadow:0 10px 24px -10px rgba(0,102,51,.55);
    }
    h1{font-size:22px; line-height:1.3; margin:0 0 4px; letter-spacing:-.01em}
    .ar{font-size:18px; color:var(--iss-d); margin:0 0 22px; direction:rtl; font-weight:600}
    .badge{
      display:inline-flex; align-items:center; gap:9px; margin:6px 0 20px;
      background:#eef6f1; color:var(--iss-d); border:1px solid #cfe6d9;
      border-radius:999px; padding:8px 16px; font-size:13.5px; font-weight:600;
    }
    .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--iss-l);
      box-shadow:0 0 0 0 rgba(10,122,72,.5); animation:pulse 2s infinite}
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(10,122,72,.45)}
      70%{box-shadow:0 0 0 10px rgba(10,122,72,0)}
      100%{box-shadow:0 0 0 0 rgba(10,122,72,0)}
    }
    @media (prefers-reduced-motion: reduce){ .badge .dot{animation:none} }
    p.lead{font-size:15px; line-height:1.6; color:var(--muted); margin:0 auto 26px; max-width:40ch}
    .divider{height:1px; background:var(--line); margin:26px 0 22px}
    footer{margin-top:4px; font-size:12.5px; color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">ISS</div>
    <h1>Institut Supérieur de la Statistique</h1>
    <p class="ar">المعهد العالي للإحصاء</p>

    <div class="badge"><span class="dot"></span> Site en construction</div>

    <p class="lead">Notre nouveau site institutionnel arrive bientôt. Merci de votre patience.</p>

    <div class="divider"></div>

    <footer>Nouakchott · Mauritanie</footer>
  </main>
</body>
</html>
