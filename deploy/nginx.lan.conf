# ═══════════════════════════════════════════════════════════════
# Nginx — Reverse proxy SIGA — variante LAN / on-premise (HTTPS auto-signé)
# Sélectionnée via .env :  SIGA_NGINX_CONF=./nginx.lan.conf
#
# Sert EXACTEMENT la même app que nginx.conf, mais :
#   - server_name _   → répond à n'importe quel Host (IP LAN, nom local…).
#   - certificat AUTO-SIGNÉ (/etc/nginx/certs/selfsigned.{crt,key}) généré par
#     `bash deploy.sh setup-lan [IP]` sur le serveur on-premise.
#   - PAS de HSTS (un HSTS + cert auto-signé bloquerait le navigateur définitivement).
#   - pas de bloc iss-gp.mr (inutile en LAN).
#
# Le placeholder `http://__SIGA_API_HOST__` (injecté au build frontend) est réécrit
# en `$scheme://$http_host` = https://192.168.0.120 → XHR même origine (cookies JWT
# Secure OK, car on est bien en HTTPS malgré le cert auto-signé).
# ═══════════════════════════════════════════════════════════════

upstream backend_upstream  { server backend:8000; }
upstream frontend_upstream { server frontend:3000; }

server_tokens off;

# ─── HTTP → redirection HTTPS ───────────────────────────────────
server {
    listen 80;
    server_name _;
    location / { return 301 https://$host$request_uri; }
}

# ─── HTTPS (app) — cert auto-signé, tout Host ───────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # PAS de HSTS ici (cert auto-signé). CSP / X-Frame-Options / etc. sont posés
    # par l'application (Next.js + Django), on ne les duplique pas.

    # ─── API Django ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── Admin Django ───────────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Statics Django ─────────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Assets PUBLICS institution (avant login, sans auth_request) ─
    location ^~ /media/institutions/logos/ {
        root /var/www;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location ^~ /media/institutions/sceaux/ {
        root /var/www;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location ^~ /media/institutions/favicons/ {
        root /var/www;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ─── Media protégé par auth_request ─────────────────────────
    location /media/ {
        auth_request /internal/media-auth/;
        alias /var/www/media/;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /internal/media-auth/ {
        internal;
        proxy_pass http://backend_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        proxy_set_header Host             $http_host;
        proxy_set_header X-Original-URI   $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie           $http_cookie;
    }

    # ─── Frontend Next.js ───────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITIQUE pour sub_filter : empêcher Next.js de gzip-er.
        proxy_set_header Accept-Encoding   "";

        # Réécriture du placeholder → $scheme://$http_host = https://<host LAN>.
        sub_filter 'http://__SIGA_API_HOST__' '$scheme://$http_host';
        sub_filter_once off;
        sub_filter_types text/html text/css text/javascript application/javascript application/json;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
