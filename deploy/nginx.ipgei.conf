# ════════════════════════════════════════════════════════════════════════════
# IPGEI — Nginx du conteneur, HTTP SIMPLE.
#
# Servi sur http://208.85.19.82:9090 : le conteneur ecoute sur 80, le compose
# publie ce 80 sur le 9090 de l'hote. Aucune redirection vers 443, aucun
# certificat — c'est le choix assume de ce deploiement.
#
# Ce fichier NE TOUCHE PAS a la pile SIGA deja en service sur cette machine :
# elle a son propre conteneur nginx, publie sur 8080, et sa propre conf.
#
# `server_name _` : on repond a n'importe quel Host. Il n'y a pas de nom de
# domaine ici, on arrive par l'IP — filtrer sur un nom n'aurait rien a filtrer.
# ════════════════════════════════════════════════════════════════════════════

# keepalive : nginx garde des connexions ouvertes vers gunicorn au lieu d'en
# rouvrir une par requete (proxy_http_version 1.1 + Connection "" dans /api/).
upstream backend_upstream  { server backend:8000; keepalive 16; }
upstream frontend_upstream { server frontend:3000; }

# Compression : notes, emploi du temps, notifications (JSON) 3 a 5 fois plus
# legers sur le reseau mobile. Les PDF et images, deja compresses, sont exclus.
gzip on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types application/json text/plain text/css application/javascript text/javascript image/svg+xml;

# Autorisation des fichiers /media/ (photos, pièces) : Django vérifie QUE CE
# FICHIER est lisible par l'appelant (core/media_auth.py : propriétaire ou
# droit RBAC). Le « oui » est donc gardé 5 min par JETON DE SESSION ET PAR
# FICHIER : une photo revue (listes, retours en arrière) ne repasse plus par
# Django, et un « oui » pour un fichier n'en ouvre jamais un autre. Sans jeton :
# jamais gardé ; un refus (401/403) : jamais gardé. Un droit retiré prend effet
# au plus tard 5 min après.
proxy_cache_path /var/cache/nginx/media_auth levels=1:2 keys_zone=media_auth:2m max_size=20m inactive=10m use_temp_path=off;
map $cookie_access_token $media_auth_sans_jeton { "" 1; default 0; }

server {
    listen 80;
    server_name _;

    # Imports de fichiers (photos, justificatifs, classeurs de notes).
    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Pas de HSTS : il forcerait le navigateur a passer en HTTPS, qui n'est pas
    # servi ici. L'y envoyer rendrait le site injoignable, et pour un an.
    # Les autres en-tetes de securite sont poses par Django et Next.js.

    # ─── Sonde de sante (application + base) ────────────────────────────────
    # Pour un superviseur externe : 200 si Django et PostgreSQL repondent.
    location = /healthz/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # ─── API Django ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les editions PDF (PV, releves) passent par wkhtmltopdf : une promotion
        # entiere depasse largement les 60 s par defaut.
        proxy_read_timeout 300s;
    }

    # ─── Admin Django ───────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Statiques Django ───────────────────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Images publiques de l'institution ──────────────────────────────────
    # Logo, sceau et favicon s'affichent AVANT la connexion — sur l'ecran de
    # login, sur la page publique de verification d'un document. Les passer par
    # auth_request les rendrait invisibles a qui n'est pas encore connecte.
    location ^~ /media/institutions/logos/ {
        root /var/www;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location ^~ /media/institutions/sceaux/ {
        root /var/www;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }
    location ^~ /media/institutions/favicons/ {
        root /var/www;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ─── Tout le reste du media : sous autorisation ─────────────────────────
    # Chaque fichier demande declenche une sous-requete a Django, qui repond 200
    # ou 403 selon les droits du porteur du cookie. Sans cela, une photo
    # d'etudiant serait lisible par quiconque connait son URL.
    location /media/ {
        auth_request /internal/media-auth/;
        alias /var/www/media/;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /internal/media-auth/ {
        internal;
        proxy_pass http://backend_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;

        proxy_cache           media_auth;
        proxy_cache_key       "$cookie_access_token|$request_uri";
        proxy_cache_valid     204 5m;
        proxy_cache_bypass    $media_auth_sans_jeton;
        proxy_no_cache        $media_auth_sans_jeton;
        proxy_ignore_headers  Cache-Control Expires Set-Cookie Vary;
    }

    # ─── Frontend Next.js ───────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITIQUE : sans cela Next.js renvoie du gzip, et sub_filter ne peut
        # pas reecrire ce qu'il ne sait pas lire.
        proxy_set_header Accept-Encoding   "";

        # Le placeholder est fige dans le bundle au moment du build. On le
        # remplace au vol par l'origine d'arrivee — ici http://208.85.19.82:9090,
        # `$http_host` portant bien le port. Les appels du navigateur repartent
        # donc vers la MEME origine que la page : c'est ce qui permet aux cookies
        # JWT httpOnly de circuler sans CORS.
        sub_filter 'http://__SIGA_API_HOST__' '$scheme://$http_host';
        sub_filter_once off;
        sub_filter_types text/html text/css text/javascript application/javascript application/json;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
