# Durcissement du service des fichiers uploadés (/media/) — complément du
# validateur applicatif core/validators.py. Objectif : même si un fichier
# malveillant (.html/.svg/.php) passait, il est TÉLÉCHARGÉ, jamais exécuté/rendu
# par le navigateur. À inclure dans le `server { ... }` qui sert SIGA.

location /media/ {
    alias /chemin/vers/siga/media/;        # = MEDIA_ROOT (BASE_DIR/media)

    # 1. Tout fichier est servi en octet-stream + forcé en téléchargement.
    #    Neutralise l'interprétation HTML/SVG (XSS stocké) et l'exécution de scripts.
    types { }                              # vide la table MIME → pas d'auto-détection
    default_type application/octet-stream;
    add_header Content-Disposition "attachment" always;

    # 2. Défense en profondeur : pas de sniffing, pas de cadrage, CSP minimale.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;

    # 3. Couper toute exécution de scripts côté serveur dans ce répertoire.
    location ~* \.(php|phar|phtml|pl|py|cgi|sh)$ {
        deny all;
    }

    # 4. Borne de taille cohérente avec DATA_UPLOAD_MAX_MEMORY_SIZE (5 Mo).
    client_max_body_size 5m;

    expires 1h;
    access_log off;
}
